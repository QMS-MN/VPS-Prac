
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample HTML Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f4f4;
        }
        header, footer {
            background: #222;
            color: white;
            padding: 15px;
            text-align: center;
        }
        main {
            background: white;
            padding: 20px;
        }
        button {
            background: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
        <nav>
            <a href="#about">About</a> |
            <a href="#services">Services</a> |
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section id="about">
            <h2>About Us</h2>
            <p>This is a sample HTML webpage.</p>
            <img src="https://placehold.co/300x150"
                 alt="Sample image">
        </section>

        <section id="services">
            <h2>Our Services</h2>
            <ul>
                <li>Web Development</li>
                <li>Mobile Applications</li>
                <li>AI Solutions</li>
            </ul>
        </section>

        <section>
            <h2>Employee Details</h2>
            <table border="1" cellpadding="10">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Role</th>
                </tr>
                <tr>
                    <td>1</td>
                    <td>John</td>
                    <td>Developer</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>David</td>
                    <td>Designer</td>
                </tr>
            </table>
        </section>

        <section id="contact">
            <h2>Contact Us</h2>
            <form>
                <label>Name:</label>
                <input type="text" placeholder="Enter name">
                <br><br>

                <label>Email:</label>
                <input type="email" placeholder="Enter email">
                <br><br>

                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>

</body>
</html>
